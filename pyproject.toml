[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rubem"
description = "Rainfall rUnoff Balance Enhanced Model (RUBEM) is a distributed hydrological model to calculate monthly flows from interception, evapotranspiration, recharge, runoff and baseflow"
readme = "README.md"
authors = [
  { name = "LabSid PHA EPUSP", email = "rubem.hydrological@labsid.eng.br" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "humanize>=4",
  "numpy>=2",
  "python-dateutil>=2",
  "pydantic>=2.11,<3",
  "typer>=0.16,<1",
]
dynamic = ["version"]
keywords = ["hydrology", "hydrological-model", "rainfall-runoff", "pcraster", "water-balance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Hydrology",
]

# pcraster and gdal are conda-only runtime dependencies: install them from
# conda-forge with environment.yml, then `pip install .` inside that
# environment. They are intentionally not listed here because they have no
# usable PyPI distribution.

[project.urls]
Homepage = "https://rubem.readthedocs.io"
Documentation = "https://rubem.readthedocs.io"
Repository = "https://github.com/LabSid-USP/RUBEM"
Issues = "https://github.com/LabSid-USP/RUBEM/issues"
Changelog = "https://rubem.readthedocs.io/en/latest/changelog.html"

[project.scripts]
rubem = "rubem.cli:main"

[project.optional-dependencies]
test = [
  "pyfakefs>=5",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3",
  "pytest-xdist>=3",
]
docs = [
  "Sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
  "sphinxcontrib-email",
  "sphinxcontrib-youtube",
]
preprocessing = [
  "pykrige>=1.7",
  "scikit-gstat>=1.0",
]
dev = [
  "rubem[test,docs,preprocessing]",
  "build",
  "codespell",
  "pre-commit",
  "ruff",
  "twine",
]

[tool.setuptools]
packages = { find = { include = ["rubem*"] } }

[tool.setuptools.dynamic]
version = { attr = "rubem.__version__" }

[tool.setuptools.package-data]
rubem = ["appsettings*.json"]

[tool.pytest.ini_options]
markers = [
  "slow: mark test as slow.",
  "unit: mark a test as a unit test.",
  "integration: mark a test as a integration test.",
  "exact: mark a test that reproduces the goldens byte-for-byte on the golden environment.",
]

[tool.coverage.run]
source = ["rubem"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9",  # pycodestyle errors
  "F",               # pyflakes
  "I",               # isort
  "PTH",             # pathlib instead of os.path
  "UP",              # pyupgrade (Python 3.12 idioms)
  "W",               # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Legacy re-export and preprocessing modules keep their star imports until the
# preprocessing overhaul rewrites them; the tests move to pathlib with the
# coverage hardening pass.
"rubem/**/__init__.py" = ["F401", "F403"]
"rubem/preprocessing/*" = ["E402", "F401", "F403", "F405", "PTH", "UP"]
"tests/**" = ["PTH", "UP"]
"doc/**" = ["PTH", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rubem", "tests"]
