# Label set used by the project. Recreate or update the labels with:
#
#   while IFS=$'\t' read -r name color description; do
#     gh label create "$name" --color "$color" --description "$description" --force
#   done < <(python3 -c "
#   import yaml
#   for l in yaml.safe_load(open('.github/labels.yml'))['labels']:
#       print(f\"{l['name']}\t{l['color']}\t{l['description']}\")
#   ")
labels:
  - name: bug
    color: d73a4a
    description: Something isn't working
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
  - name: enhancement
    color: a2eeef
    description: New feature or request
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
  - name: help wanted
    color: 008672
    description: Extra attention is needed
  - name: invalid
    color: e4e669
    description: This doesn't seem right
  - name: question
    color: d876e3
    description: Further information is requested
  - name: wontfix
    color: ffffff
    description: This will not be worked on
  - name: stale
    color: ededed
    description: Inactive for longer than the stale-bot window
  - name: high
    color: b60205
    description: High priority
  - name: medium
    color: fbca04
    description: Medium priority
  - name: low
    color: 0e8a16
    description: Low priority
  - name: test
    color: 5319e7
    description: Test suite and fixtures
  - name: roadmap
    color: 1d76db
    description: Planned in the active development roadmap
  - name: paper
    color: 006b75
    description: Conformity with the published model description
  - name: breaking-change
    color: e11d21
    description: Changes behavior or a public interface
