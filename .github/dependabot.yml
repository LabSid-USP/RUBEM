version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-packages:
        patterns:
          - "*"
  - package-ecosystem: "conda"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # The supported interpreter range is a project decision and the CI matrix
    # builds an environment per version, so a raised floor breaks every leg
    # below it.
    ignore:
      - dependency-name: "python"
    groups:
      conda-packages:
        patterns:
          - "*"
