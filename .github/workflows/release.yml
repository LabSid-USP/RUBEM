name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert the tag points at main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  ci:
    needs: ancestry
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Assert the installed version matches the tag
        id: version
        run: |
          python -m venv "$RUNNER_TEMP/verify"
          source "$RUNNER_TEMP/verify/bin/activate"
          pip install dist/*.whl
          tag="${GITHUB_REF_NAME#v}"
          installed=$(python -c "import importlib.metadata as m; print(m.version('rubem'))")
          echo "tag=$tag installed=$installed"
          test "$tag" = "$installed"
          echo "installed=$installed" >> "$GITHUB_OUTPUT"
      # A separate environment keeps the verify one holding the wheel alone, so
      # the smoke below still proves the natives are missing.
      - name: Classify the release channel
        id: channel
        env:
          INSTALLED_VERSION: ${{ steps.version.outputs.installed }}
        run: |
          python -m venv "$RUNNER_TEMP/channel"
          "$RUNNER_TEMP/channel/bin/pip" install --quiet "packaging==26.3"
          prerelease=$("$RUNNER_TEMP/channel/bin/python" -c 'import os; from packaging.version import Version; print(str(Version(os.environ["INSTALLED_VERSION"]).is_prerelease).lower())')
          echo "installed=$INSTALLED_VERSION prerelease=$prerelease"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Smoke test the promoted wheel without native dependencies
        run: |
          source "$RUNNER_TEMP/verify/bin/activate"
          cd "$RUNNER_TEMP"
          rubem --version
          echo '{}' > smoke-config.json
          if output=$(rubem -c smoke-config.json 2>&1); then
            echo "rubem must fail without pcraster/GDAL" >&2
            exit 1
          else
            echo "$output" | grep -q "environment.yml"
          fi

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # The SBOM describes the wheel that is published: it is installed alone
      # in a clean environment, which a separate environment holding only the
      # generator inventories, so cyclonedx-bom and its own dependencies never
      # appear in the report as though they shipped with RUBEM.
      - name: Build the software bill of materials
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install --quiet dist/*.whl
          python -m venv "$RUNNER_TEMP/cyclonedx"
          "$RUNNER_TEMP/cyclonedx/bin/pip" install --quiet "cyclonedx-bom==7.0.0"
          "$RUNNER_TEMP/cyclonedx/bin/cyclonedx-py" environment "$RUNNER_TEMP/wheel" \
            --output-format JSON --output-file dist/sbom.cdx.json
          python3 ci/conda_inventory.py ci/golden-env.lock dist/conda-inventory.json
      - name: Compute checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz sbom.cdx.json conda-inventory.json > SHA256SUMS.txt
      - name: Sign the distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            dist/*.whl
            dist/*.tar.gz
          release-signing-artifacts: false
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Create the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease }}
          files: |
            dist/*
